# Mobile Transcode Rules for Lyrion Music Server
# custom-convert.conf rules for mobile Squeezebox clients. Each rule applies
# only to the app whose Model name it carries (Model=LyrPlay in the HELO).
#
# Installation: LMS Settings > Plugins > Mobile Transcode Rules, then restart
# LMS. LMS reads this file from the plugin's folder; nothing to copy.

# ============================================================================
# LyrPlay (iOS) - Optimized for iOS devices
# ============================================================================
# Each rule appears twice. LMS tries them in order:
# - FT (local files): flac opens the file and cuts cue-sheet tracks exactly
#   with --skip/--until.
# - IT (piped input: streaming services such as Qobuz, remote URLs). LMS
#   starts the pipe at the track itself, so NOSTART=I leaves out --skip
#   (1.5.0 skipped twice, and every cue track after the first was empty).
#   Local files never reach this copy: LMS picks the first rule that fits.
# Output keeps the source's sample rate and bit depth. D resamples only when
# the file's rate is above LyrPlay's Max Sample Rate setting.

# FLAC to FLAC ("Lossless (FLAC)"). Re-encoding gives every stream, including
# a seek or a cue track, a FLAC header at its start, which LyrPlay's BASS push
# stream needs.
flc flc LyrPlay *
	# FT:{START=--skip=%t}U:{END=--until=%v}D:{RESAMPLE=-r %d}
	[flac] -dcs $START$ $END$ --force-raw-format --sign=signed --endian=little -- $FILE$ | [sox] -q -t raw --encoding signed-integer -b $SAMPLESIZE$ -r $SAMPLERATE$ -c $CHANNELS$ -L - -t flac $RESAMPLE$ -C 0 -

flc flc LyrPlay *
	# IT:{START=--skip=%t}U:{END=--until=%v}D:{RESAMPLE=-r %d}E:{NOSTART=I}
	[flac] -dcs $START$ $END$ --force-raw-format --sign=signed --endian=little -- $FILE$ | [sox] -q -t raw --encoding signed-integer -b $SAMPLESIZE$ -r $SAMPLERATE$ -c $CHANNELS$ -L - -t flac $RESAMPLE$ -C 0 -

# FLAC to WAV ("Lossless (WAV)").
flc wav LyrPlay *
	# FT:{START=--skip=%t}U:{END=--until=%v}D:{RESAMPLE=-r %d}
	[flac] -dcs $START$ $END$ --force-raw-format --sign=signed --endian=little -- $FILE$ | [sox] -q -t raw --encoding signed-integer -b $SAMPLESIZE$ -r $SAMPLERATE$ -c $CHANNELS$ -L - -t wav $RESAMPLE$ -

flc wav LyrPlay *
	# IT:{START=--skip=%t}U:{END=--until=%v}D:{RESAMPLE=-r %d}E:{NOSTART=I}
	[flac] -dcs $START$ $END$ --force-raw-format --sign=signed --endian=little -- $FILE$ | [sox] -q -t raw --encoding signed-integer -b $SAMPLESIZE$ -r $SAMPLERATE$ -c $CHANNELS$ -L - -t wav $RESAMPLE$ -

# FLAC to Opus ("Premium Quality (Opus)"), 256 kbps target (variable
# bitrate). Opus always encodes at 48 kHz, so it needs no resample step.
flc ops LyrPlay *
	# FT:{START=--skip=%t}U:{END=--until=%v}D:{RESAMPLE=-r %d}
	[flac] -dcs $START$ $END$ --force-raw-format --sign=signed --endian=little -- $FILE$ | [opusenc] --raw --raw-bits=$SAMPLESIZE$ --raw-rate=$SAMPLERATE$ --raw-chan=$CHANNELS$ --bitrate=256 - -

flc ops LyrPlay *
	# IT:{START=--skip=%t}U:{END=--until=%v}D:{RESAMPLE=-r %d}E:{NOSTART=I}
	[flac] -dcs $START$ $END$ --force-raw-format --sign=signed --endian=little -- $FILE$ | [opusenc] --raw --raw-bits=$SAMPLESIZE$ --raw-rate=$SAMPLERATE$ --raw-chan=$CHANNELS$ --bitrate=256 - -

# FLAC to Ogg Vorbis ("High Quality (OGG Vorbis)"), quality 10: Vorbis's
# highest setting (variable bitrate, so the rate depends on the music).
flc ogg LyrPlay *
	# FT:{START=--skip=%t}U:{END=--until=%v}D:{RESAMPLE=-r %d}
	[flac] -dcs $START$ $END$ --force-raw-format --sign=signed --endian=little -- $FILE$ | [sox] -q -t raw --encoding signed-integer -b $SAMPLESIZE$ -r $SAMPLERATE$ -c $CHANNELS$ -L - -t ogg $RESAMPLE$ -C 10 -

flc ogg LyrPlay *
	# IT:{START=--skip=%t}U:{END=--until=%v}D:{RESAMPLE=-r %d}E:{NOSTART=I}
	[flac] -dcs $START$ $END$ --force-raw-format --sign=signed --endian=little -- $FILE$ | [sox] -q -t raw --encoding signed-integer -b $SAMPLESIZE$ -r $SAMPLERATE$ -c $CHANNELS$ -L - -t ogg $RESAMPLE$ -C 10 -

# FLAC to MP3 at 320 kbps ("Compressed (MP3 preferred)"; "Compressed (AAC
# preferred)" gets it too, since there is no FLAC to AAC rule). -b 320
# instead of $BITRATE$, which defaults to 128 kbps. lame lowers rates above
# 48 kHz itself.
flc mp3 LyrPlay *
	# FT:{START=--skip=%t}U:{END=--until=%v}D:{RESAMPLE=--resample %D}
	[flac] -dcs $START$ $END$ -- $FILE$ | [lame] --silent -q 0 $RESAMPLE$ -b 320 - -

flc mp3 LyrPlay *
	# IT:{START=--skip=%t}U:{END=--until=%v}D:{RESAMPLE=--resample %D}E:{NOSTART=I}
	[flac] -dcs $START$ $END$ -- $FILE$ | [lame] --silent -q 0 $RESAMPLE$ -b 320 - -

# Ogg FLAC (FLAC in an Ogg container, type ogf), e.g. some Icecast radio
# stations. Without these rules LMS falls back to its own "ogf flc" rule and
# sends FLAC whatever LyrPlay's Audio Format says. The decoded audio is
# piped as WAV, so the encoders read its format from the header (sample size
# and rate may be unknown for a radio stream).
ogf ops LyrPlay *
	# IFD
	[flac] --ogg -dcs -- $FILE$ | [opusenc] --bitrate=256 --ignorelength - -

ogf ogg LyrPlay *
	# IFD:{RESAMPLE=-r %d}
	[flac] --ogg -dcs -- $FILE$ | [sox] -q -t wav --ignore-length - -t ogg $RESAMPLE$ -C 10 -

ogf mp3 LyrPlay *
	# IFD:{RESAMPLE=--resample %D}
	[flac] --ogg -dcs -- $FILE$ | [lame] --silent -q 0 $RESAMPLE$ -b 320 - -

# ============================================================================
# Add Your App's Rules Here
# ============================================================================
# To add transcode rules for your mobile app:
#
# 1. Set your app's Model name in SlimProto HELO capabilities
#    Example: Model=YourApp
#
# 2. Copy the template below and customize:
#    - Replace "YourApp" with your model name
#    - Set quality parameters (sample rate, bit depth, bitrate)
#    - Keep each rule as two copies, FT then IT with E:{NOSTART=I}:
#      local files use the first (exact cue-sheet cuts), piped sources
#      (streaming services, remote URLs) the second. A single IFT rule
#      without NOSTART=I plays only the first track of a cue-sheet album.
#
# 3. Test thoroughly with your app
#
# 4. Share your rules with the community!
#
# Template:
#
# flc flc YourApp *
#     # FT:{START=--skip=%t}U:{END=--until=%v}D:{RESAMPLE=-r %d}
#     [flac] -dcs $START$ $END$ --force-raw-format --sign=signed --endian=little -- $FILE$ | [sox] -q -t raw --encoding signed-integer -b $SAMPLESIZE$ -r $SAMPLERATE$ -c $CHANNELS$ -L - -t flac $RESAMPLE$ -C 0 -
#
# flc flc YourApp *
#     # IT:{START=--skip=%t}U:{END=--until=%v}D:{RESAMPLE=-r %d}E:{NOSTART=I}
#     [flac] -dcs $START$ $END$ --force-raw-format --sign=signed --endian=little -- $FILE$ | [sox] -q -t raw --encoding signed-integer -b $SAMPLESIZE$ -r $SAMPLERATE$ -c $CHANNELS$ -L - -t flac $RESAMPLE$ -C 0 -
#
# The LyrPlay rules above show the same pattern for Opus, Ogg Vorbis, MP3
# and WAV.

# ============================================================================
# LyrPlay offline copies (downloads)
# ============================================================================
# Same encoders and settings as the stream rules above, so a copy matches
# the stream. The output types are private (custom-types.conf): a "* *" rule
# for ops or ogg would also apply to every player that lists those formats
# before flc (squeezelite does) when "prioritize native format" is off.
flc lyo * *
	# F:{START=--skip=%t}U:{END=--until=%v}
	[flac] -dcs $START$ $END$ --force-raw-format --sign=signed --endian=little -- $FILE$ | [opusenc] --raw --raw-bits=$SAMPLESIZE$ --raw-rate=$SAMPLERATE$ --raw-chan=$CHANNELS$ --bitrate=256 - -

flc lyv * *
	# F:{START=--skip=%t}U:{END=--until=%v}
	[flac] -dcs $START$ $END$ --force-raw-format --sign=signed --endian=little -- $FILE$ | [sox] -q -t raw --encoding signed-integer -b $SAMPLESIZE$ -r $SAMPLERATE$ -c $CHANNELS$ -L - -t ogg -C 10 -
