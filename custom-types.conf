# Private download types for LyrPlay's offline copies.
# No player advertises these, so they never change what a player streams:
# only /music/<id>/download.<type> asks for them (downloads carry no player,
# so their rules must be "* *").
#ID     Suffix          Mime Content-Type               Server File Type
lyo     lyo             audio/ogg                       audio
lyv     lyv             audio/ogg                       audio
