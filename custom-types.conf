# Private download types for LyrPlay's offline copies.
# No player advertises these, so they never change what a player streams:
# only /music/<id>/download.<type> asks for them (downloads carry no player,
# so their rules must be "* *").
# Their MIME types are private too. LMS maps a stream's Content-Type to a
# type, and the plugin file read last wins (the order changes with each LMS
# start). With audio/ogg here (1.4.0 to 1.5.3), Ogg radio could become "lyv"
# and fail on every player: "Couldn't create command line for lyv playback".
#ID     Suffix          Mime Content-Type               Server File Type
lyo     lyo             audio/x-lyrplay-opus                       audio
lyv     lyv             audio/x-lyrplay-vorbis                       audio
